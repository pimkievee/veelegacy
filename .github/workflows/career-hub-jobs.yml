name: Update Career Hub jobs
on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: career-hub-jobs
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/veelegacy-career-hub
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run importer tests
        run: python -m unittest discover -s tests -v
      - name: Import approved job feeds
        run: python scripts/update_jobs.py
      - name: Commit updated job data
        run: |
          if ! git diff --quiet -- jobs/jobs.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add jobs/jobs.json
            git commit -m "Update Career Hub job listings"
            git push origin HEAD:feature/veelegacy-career-hub
          fi
